<?xml version="1.0" encoding="UTF-8"?>
<!-- Cut marks for 69 x 94 mm artworks, 4 x 2 grid on A4 landscape. Units are millimeters. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 297 210">
  <g fill="none" stroke="#ed2224" stroke-width="0.25">
    <!-- Vertical cuts -->
    <line x1="10.5" y1="5.5" x2="10.5" y2="9.5"/>
    <line x1="10.5" y1="200.5" x2="10.5" y2="204.5"/>
    <line x1="79.5" y1="5.5" x2="79.5" y2="9.5"/>
    <line x1="79.5" y1="200.5" x2="79.5" y2="204.5"/>
    <line x1="148.5" y1="5.5" x2="148.5" y2="9.5"/>
    <line x1="148.5" y1="200.5" x2="148.5" y2="204.5"/>
    <line x1="217.5" y1="5.5" x2="217.5" y2="9.5"/>
    <line x1="217.5" y1="200.5" x2="217.5" y2="204.5"/>
    <line x1="286.5" y1="5.5" x2="286.5" y2="9.5"/>
    <line x1="286.5" y1="200.5" x2="286.5" y2="204.5"/>
    <!-- Horizontal cuts -->
    <line x1="5" y1="11" x2="9" y2="11"/>
    <line x1="288" y1="11" x2="292" y2="11"/>
    <line x1="5" y1="105" x2="9" y2="105"/>
    <line x1="288" y1="105" x2="292" y2="105"/>
    <line x1="5" y1="199" x2="9" y2="199"/>
    <line x1="288" y1="199" x2="292" y2="199"/>
  </g>
</svg>
